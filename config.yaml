# Hestia Vigil Configuration

# FIRMS satellite data source
SOURCE: "VIIRS_SNPP_NRT"

# Bounding box for data pull: [min_lon, min_lat, max_lon, max_lat]
# Default: continental US
BBOX: [-125.0, 24.0, -66.0, 50.0]

# How often to poll FIRMS (minutes)
POLL_INTERVAL_MINUTES: 60

# Day range for FIRMS data (1-5)
DAY_RANGE: 1

# Watch zones — named bounding boxes to monitor
WATCH_ZONES:
  michigan_west:
    label: "Western Michigan"
    bbox: [-87.0, 42.5, -85.0, 44.0]

# Alerting
ALERTS:
  telegram_webhook:
    enabled: true
    webhook_env: "TELEGRAM_WEBHOOK_URL"
  email:
    enabled: false
